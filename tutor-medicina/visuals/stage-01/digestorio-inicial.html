<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Início do sistema digestório</title>
<style>
:root{--bg:#fff;--fg:#1a1a1a;--mut:#555;--bd:#ccc}
@media (prefers-color-scheme:dark){:root{--bg:#161616;--fg:#eee;--mut:#aaa;--bd:#444}}
body{font-family:system-ui,sans-serif;max-width:900px;margin:16px auto;padding:0 16px;background:var(--bg);color:var(--fg)}
h1{font-size:20px} svg{width:100%;height:auto;border:1px solid var(--bd);border-radius:8px;background:var(--bg)}
button{font:inherit;padding:6px 10px;margin:2px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--fg);cursor:pointer}
button[aria-pressed=true]{background:#2471a3;color:#fff;border-color:#2471a3}
#info{border:1px solid var(--bd);border-radius:8px;padding:10px;margin-top:10px}
svg text{fill:var(--fg);font-size:13px;paint-order:stroke;stroke:var(--bg);stroke-width:3px}
small{color:var(--mut)}
</style></head><body>
<h1>Início do sistema digestório (SP 1: Energia que não dura)</h1>
<div id="tabs"></div><div id="sub"></div>
<svg id="v" viewBox="0 0 800 440" role="img" aria-label="Esquema"></svg>
<div id="info"></div>
<p><small>Esquemas didáticos, sem escala. Baseados no roteiro e no resumo da SP 1 (Tortora, Junqueira, Silverthorn).</small></p>
<script>
const T=(x,y,s,a='middle',sz=13,w='normal',c)=>`<text x="${x}" y="${y}" text-anchor="${a}" font-size="${sz}" font-weight="${w}" ${c?`style="fill:${c}"`:''}>${s}</text>`;
const defs=`<defs><marker id="ah" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="8" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#c0392b"/></marker></defs>`;
let tab=0,sub=0;

/* ---- 1. Deglutição ---- */
function degl(){const s=sub;let o=defs;
 o+=`<ellipse cx="330" cy="150" rx="165" ry="125" fill="#fde3cf" stroke="#b9770e" stroke-width="2"/>`;
 o+=`<rect x="190" y="120" width="145" height="30" rx="8" fill="#d6eaf8" stroke="#2874a6"/>`+T(262,140,'cavidade nasal','middle',11);
 o+=`<line x1="190" y1="160" x2="335" y2="160" stroke="#7b241c" stroke-width="7"/>`+T(235,176,'palato duro','middle',11);
 // palato mole
 if(s==1)o+=`<path d="M335,160 Q350,150 360,128" fill="none" stroke="#c0392b" stroke-width="8" stroke-linecap="round"/>`;
 else o+=`<path d="M335,160 L362,176" fill="none" stroke="#c0392b" stroke-width="8" stroke-linecap="round"/>`;
 o+=T(420,150,'palato mole + úvula','start',12);
 o+=`<ellipse cx="270" cy="212" rx="75" ry="24" fill="#f1948a" stroke="#922b21"/>`+T(250,216,'língua','middle',12);
 o+=`<rect x="190" y="170" width="145" height="12" fill="none"/>`;
 // faringe
 o+=`<rect x="342" y="120" width="48" height="190" rx="10" fill="#e8daef" stroke="#6c3483" opacity=".7"/>`;
 o+=T(412,128,'nasofaringe','start',11)+T(412,205,'orofaringe','start',11)+T(412,290,'laringofaringe','start',11);
 // laringe/traqueia (ar) e esofago
 o+=`<rect x="300" y="300" width="38" height="125" rx="8" fill="#d6eaf8" stroke="#2874a6"/>`+T(300,438,'laringe → traqueia','middle',11);
 o+=`<rect x="344" y="310" width="40" height="115" rx="8" fill="#f5b7b1" stroke="#a93226"/>`+T(400,425,'esôfago','start',11);
 // epiglote
 if(s==1)o+=`<path d="M326,268 L350,284" stroke="#c0392b" stroke-width="7" stroke-linecap="round" fill="none"/>`;
 else o+=`<path d="M326,268 L338,246" stroke="#7d3c98" stroke-width="7" stroke-linecap="round" fill="none"/>`;
 o+=T(300,262,'epiglote','end',12);
 // bolo
 const pos=[[255,190],[366,262],[364,365]][s];
 o+=`<circle cx="${pos[0]}" cy="${pos[1]}" r="13" fill="#7e5109" stroke="#fff" stroke-width="2"/>`;
 o+=T(640,300,['1. VOLUNTÁRIA','2. FARÍNGEA','3. ESOFÁGICA'][s],'middle',16,'bold');
 const nt=[['a língua sobe e empurra','o bolo contra o palato'],['palato mole e úvula SOBEM','(fecham a nasofaringe)','epiglote FECHA a laringe','respiração para · EES relaxa'],['peristaltismo leva o bolo','ao estômago','EEI relaxa']][s];
 nt.forEach((t,i)=>o+=T(640,325+i*20,t,'middle',13));
 return o}
const deglInfo=[
 '<b>Fase voluntária:</b> a língua sobe e empurra o bolo contra o palato; o bolo vai para a <b>parte oral da faringe</b>. Aqui você ainda controla.',
 '<b>Fase faríngea (involuntária):</b> receptores da orofaringe → <b>nervo IX</b> → centro da deglutição (bulbo e ponte). <b>Palato mole e úvula sobem</b> (nada entra no nariz), a <b>laringe sobe e a epiglote fecha</b> (nada entra na via aérea), a respiração é inibida e o <b>esfíncter esofágico superior relaxa</b>.',
 '<b>Fase esofágica (involuntária):</b> <b>peristaltismo</b>. Acima do bolo, as fibras <b>circulares</b> contraem e empurram; abaixo, as <b>longitudinais</b> contraem e "abrem espaço". O <b>EEI relaxa</b> e o bolo passa ao estômago. Sólidos levam ~4–8 s; líquidos ~1 s.'];

/* ---- 2. Esôfago ---- */
function esof(){let o='';
 // tubo
 o+=`<rect x="130" y="50" width="46" height="340" rx="18" fill="#f5b7b1" stroke="#a93226" stroke-width="2"/>`;
 // musculo
 o+=`<rect x="20" y="50" width="26" height="110" fill="#e74c3c"/><rect x="20" y="160" width="26" height="110" fill="url(#g1)"/><rect x="20" y="270" width="26" height="120" fill="#f8c471"/>`;
 o+=`<defs><linearGradient id="g1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e74c3c"/><stop offset="1" stop-color="#f8c471"/></linearGradient></defs>`;
 o+=T(35,40,'músculo','middle',12,'bold')+T(52,110,'esquelético','start',11)+T(52,215,'misto','start',11)+T(52,330,'liso','start',11);
 // constrições
 [[88,'1. Cervical (cricofaríngea) · C6','a mais estreita'],[160,'2. Aórtica · T4','arco da aorta'],[210,'3. Bronquial · T5','brônquio principal esquerdo'],[330,'4. Diafragmática (hiatal) · T10','hiato esofágico do diafragma']].forEach(c=>{
  o+=`<line x1="118" y1="${c[0]}" x2="188" y2="${c[0]}" stroke="#c0392b" stroke-width="3"/><line x1="188" y1="${c[0]}" x2="230" y2="${c[0]}" stroke="#c0392b"/>`+T(236,c[0]+4,c[1],'start',13,'bold')+T(236,c[0]+20,c[2],'start',11)});
 o+=`<rect x="100" y="368" width="110" height="30" rx="10" fill="#fcf3cf" stroke="#b7950b"/>`+T(155,388,'estômago','middle',12);
 o+=T(620,30,'Camadas da parede (corte transversal)','middle',14,'bold');
 const cx=690,cy=130,k=.55;
 const rg=[[140,'#fdebd0','#7e5109'],[120,'#e59866','#a04000'],[100,'#f0b27a','#a04000'],[80,'#fadbd8','#922b21'],[58,'#f5b7b1','#922b21'],[40,'#fff','#6c3483']];
 rg.forEach(r=>o+=`<circle cx="${cx}" cy="${cy}" r="${r[0]*k}" fill="${r[1]}" stroke="${r[2]}" ${r[0]==40?'stroke-width="4"':''}/>`);
 const lg=[['adventícia',rg[0]],['muscular externa: longitudinal',rg[1]],['muscular externa: circular',rg[2]],['submucosa (glândulas esofágicas: muco)',rg[3]],['lâmina própria + muscular da mucosa',rg[4]],['epitélio estratificado pavimentoso não queratinizado',rg[5]]];
 lg.forEach((l,i)=>{const y=240+i*26;o+=`<rect x="440" y="${y-11}" width="16" height="14" fill="${l[1][1]}" stroke="${l[1][2]}"/>`+T(464,y,l[0],'start',12)});
 return o}
const esoInfo='<b>Esôfago:</b> tubo muscular de ~25 cm, atrás da traqueia, que perfura o diafragma no <b>hiato esofágico (T10)</b>. <b>Epitélio estratificado pavimentoso não queratinizado</b> (resiste ao atrito), <b>glândulas mucosas</b> (lubrificam), muscular <b>esquelética → mista → lisa</b> de cima para baixo e <b>adventícia</b> (serosa só no trecho intraperitoneal). <b>Constrições:</b> C6 (cricoide, a mais estreita) · T4 (aorta) · T5 (brônquio E) · T10 (hiato). Não digere nem absorve: conduz.';

/* ---- 3. Glândulas salivares ---- */
function gl(){let o='';
 const ser=(x,y)=>`<circle cx="${x}" cy="${y}" r="17" fill="#6c3483" opacity=".85" stroke="#4a235a"/><circle cx="${x}" cy="${y+3}" r="4" fill="#f5eef8"/>`;
 const muc=(x,y,semi)=>`<ellipse cx="${x}" cy="${y}" rx="22" ry="14" fill="#fdfefe" stroke="#999"/><ellipse cx="${x-5}" cy="${y+3}" rx="4" ry="2" fill="#555"/>${semi?`<path d="M${x+14},${y-12} q16,4 14,24 q-8,-10 -14,-12 z" fill="#6c3483"/>`:''}`;
 const col=[130,400,670];
 const nm=['PARÓTIDA','SUBMANDIBULAR','SUBLINGUAL'],sc=['só serosa; aquosa, rica em amilase','mista, mais serosa; amilase + muco','mista, mais mucosa; pouca amilase'];
 col.forEach((x,i)=>{o+=`<rect x="${x-120}" y="40" width="240" height="200" rx="12" fill="#fdf2e9" stroke="#b9770e"/>`+T(x,32,nm[i],'middle',14,'bold')+T(x,262,sc[i],'middle',11)});
 // parotida: so serosos
 [[60,90],[100,70],[140,95],[180,75],[85,130],[125,125],[165,135],[70,175],[110,180],[150,185],[190,170]].forEach(p=>o+=ser(p[0]+0,p[1]+20));
 // submand
 [[330,90],[368,70],[404,95],[442,75],[345,135],[385,130],[425,140],[470,115],[350,185],[395,190]].forEach(p=>o+=ser(p[0],p[1]+20));
 o+=muc(450,190,1)+muc(480,150,1);
 // sublingual
 [[610,100],[650,85],[690,100],[630,140],[670,150],[705,140],[615,185],[660,195],[700,185]].forEach((p,i)=>o+=muc(p[0],p[1]+15,1));
 o+=ser(740,200).replace('r="17"','r="12"');
 o+=`<circle cx="30" cy="318" r="9" fill="#6c3483"/>`+T(46,322,'célula serosa: escura, granulosa, núcleo redondo (faz enzima: amilase, lisozima)','start',12);
 o+=`<ellipse cx="30" cy="344" rx="11" ry="8" fill="#fdfefe" stroke="#999"/>`+T(46,348,'célula mucosa: clara, "vazia", núcleo achatado na base (faz muco)','start',12);
 o+=`<path d="M22,364 q10,4 8,14 q-6,-6 -8,-8z" fill="#6c3483"/>`+T(46,376,'semilua serosa: capuz escuro sobre célula clara (lisozima)','start',12);
 o+=T(30,398,'Ductos: ácino → intercalar (cuboide simples, curto) → estriado (estrias basais,','start',12)+T(30,416,'transporta íons) → interlobular → ducto principal (epitélio estratificado pavimentoso)','start',12);
 return o}
const glInfo='<b>Como diferenciar na lâmina:</b> só células escuras e granulosas → <b>parótida</b>. Ácinos escuros misturados com túbulos claros e semiluas, ductos estriados evidentes → <b>submandibular</b>. Predomínio de células claras, com semiluas escuras só nas pontas → <b>sublingual</b>. A parótida abre no vestíbulo (oposto ao 2º molar superior); a submandibular, ao lado do frênulo da língua.';

/* ---- 4. Amilase ---- */
function amil(){let o='';
 const bead=(x,y,c='#2e86c1')=>`<circle cx="${x}" cy="${y}" r="9" fill="${c}" stroke="#1b4f72"/>`;
 // amido
 o+=T(120,40,'AMIDO (polissacarídeo)','middle',14,'bold');
 for(let i=0;i<9;i++)o+=bead(40+i*20,70);
 o+=T(400,40,'após a amilase salivar','middle',14,'bold');
 for(let i=0;i<2;i++)o+=bead(300+i*20,70,'#27ae60');o+=T(320,100,'maltose','middle',11);
 for(let i=0;i<3;i++)o+=bead(370+i*20,70,'#27ae60');o+=T(400,100,'maltotriose','middle',11);
 for(let i=0;i<4;i++)o+=bead(470+i*20,70,'#27ae60');o+=T(510,100,'α-dextrina','middle',11);
 o+=`<text x="215" y="75" font-size="22" style="fill:#c0392b">✂ →</text>`;
 // fluxo
 const boxes=[['BOCA','mastigação + saliva\namilase ativada por Cl⁻'],['BOLO ENGLUTIDO','a amilase continua ~1 h'],['ESTÔMAGO','ácido (pH baixo)\nINATIVA a amilase'],['INTESTINO','amilase pancreática +\nborda em escova → glicose']];
 boxes.forEach((b,i)=>{const x=30+i*190;o+=`<rect x="${x}" y="150" width="170" height="90" rx="12" fill="${i==2?'#fadbd8':'#eaf2f8'}" stroke="#2874a6"/>`+T(x+85,175,b[0],'middle',13,'bold');b[1].split('\n').forEach((t,j)=>o+=T(x+85,198+j*18,t,'middle',11));if(i<3)o+=`<line x1="${x+172}" y1="195" x2="${x+188}" y2="195" stroke="#c0392b" stroke-width="3" marker-end="url(#ah)"/>`});
 o+=defs;
 // teste lugol
 o+=T(400,280,'Teste experimental com lugol (iodo)','middle',14,'bold');
 const tube=(x,col,l1,l2)=>`<rect x="${x-24}" y="295" width="48" height="90" rx="10" fill="${col}" stroke="#555"/>`+T(x,405,l1,'middle',12,'bold')+T(x,422,l2,'middle',11);
 o+=tube(150,'#1b2631','CONTROLE','amido + lugol: azul-escuro')+tube(400,'#d4ac0d','EXPERIMENTAL','amido + saliva + lugol: amarelo')+T(620,350,'amido digerido → lugol não fica azul','middle',12);
 return o}
const amInfo='<b>Amilase salivar:</b> produzida sobretudo pela <b>parótida</b>; <b>ativada por Cl⁻</b>; quebra o <b>amido</b> em maltose, maltotriose e α-dextrina; age na boca e ~1 h no bolo engolido; é <b>inativada pelo ácido gástrico</b>. Só <b>monossacarídeos</b> são absorvidos. Por isso o pão fica adocicado ao mastigar. No teste com <b>lugol</b>: amido = azul-escuro; se a saliva digeriu o amido, a cor não aparece. A <b>lipase lingual</b> (glândulas de von Ebner) age no estômago sobre triglicerídeos.';

const TABS=[['Deglutição',['1. Voluntária','2. Faríngea','3. Esofágica'],degl,deglInfo],
 ['Esôfago',[],esof,esoInfo],['Glândulas salivares',[],gl,glInfo],['Amilase salivar',[],amil,amInfo]];
const tb=document.getElementById('tabs'),sb=document.getElementById('sub');
TABS.forEach((t,i)=>{const b=document.createElement('button');b.textContent=t[0];b.onclick=()=>{tab=i;sub=0;setup()};tb.appendChild(b)});
function setup(){sb.innerHTML='';TABS[tab][1].forEach((n,i)=>{const b=document.createElement('button');b.textContent=n;b.onclick=()=>{sub=i;draw()};sb.appendChild(b)});draw()}
function draw(){document.getElementById('v').innerHTML=TABS[tab][2]();const inf=TABS[tab][3];document.getElementById('info').innerHTML=Array.isArray(inf)?inf[sub]:inf;
 [...tb.children].forEach((b,i)=>b.setAttribute('aria-pressed',i==tab));[...sb.children].forEach((b,i)=>b.setAttribute('aria-pressed',i==sub))}
setup();
</script></body></html>
